<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">RV32I five-stage pipeline datapath</title><desc id="desc">IF, ID, EX, MEM, and WB can hold different instructions. Valid bits mark occupied stage registers. RAW dependencies, memory waits, branches, and faults control progress.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#183153"/></marker><style>.box{fill:#eef5fb;stroke:#183153;stroke-width:2}.reg{fill:#e8f4f2;stroke:#176b63;stroke-width:2}.wire{fill:none;stroke:#183153;stroke-width:2;marker-end:url(#arrow)}.control{fill:none;stroke:#a35f18;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}.title{font:bold 25px Georgia,serif;fill:#183153;text-anchor:middle}.name{font:bold 18px Arial,sans-serif;fill:#183153;text-anchor:middle}.note{font:13px Arial,sans-serif;fill:#34495e;text-anchor:middle}</style></defs>
<rect width="1200" height="590" fill="white"/><text x="600" y="37" class="title">RV32I in-order five-stage pipeline</text>
<rect x="35" y="125" width="180" height="145" rx="8" class="box"/><text x="125" y="160" class="name">IF</text><text x="125" y="190" class="note">fetch_pc_q</text><text x="125" y="215" class="note">instruction valid/ready</text><text x="125" y="240" class="note">hold request until ready</text>
<rect x="264" y="125" width="180" height="145" rx="8" class="box"/><text x="354" y="160" class="name">ID</text><text x="354" y="190" class="note">decode and immediate</text><text x="354" y="215" class="note">read register file</text><text x="354" y="240" class="note">wait on RAW dependency</text>
<rect x="493" y="125" width="180" height="145" rx="8" class="box"/><text x="583" y="160" class="name">EX</text><text x="583" y="190" class="note">ALU and comparison</text><text x="583" y="215" class="note">branch target or address</text><text x="583" y="240" class="note">check alignment</text>
<rect x="722" y="125" width="180" height="145" rx="8" class="box"/><text x="812" y="160" class="name">MEM</text><text x="812" y="190" class="note">data valid/ready</text><text x="812" y="215" class="note">byte lanes and load align</text><text x="812" y="240" class="note">hold younger stages</text>
<rect x="951" y="125" width="180" height="145" rx="8" class="box"/><text x="1041" y="160" class="name">WB</text><text x="1041" y="190" class="note">write rd, except x0</text><text x="1041" y="215" class="note">retire PC + instruction</text><text x="1041" y="240" class="note">one per clock edge</text>
<path d="M215 196H264M444 196H493M673 196H722M902 196H951" class="wire"/>
<text x="239" y="105" class="note">if_valid_q</text><text x="468" y="105" class="note">id_valid_q</text><text x="697" y="105" class="note">ex_valid_q</text><text x="926" y="105" class="note">wb_valid_q</text>
<path d="M583 270V365H125V270" class="control"/><text x="354" y="345" class="note">taken branch or jump redirects fetch in EX</text>
<path d="M812 270V413H354V270" class="control"/><text x="583" y="397" class="note">memory wait holds younger stages</text>
<rect x="120" y="470" width="960" height="65" rx="8" class="reg"/><text x="600" y="495" class="name">Valid bits separate occupied stages from bubbles</text><text x="600" y="521" class="note">A fault discards younger work; older instructions retire before the trap record becomes sticky.</text>
</svg>
