<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc">
<title id="title">Pipeline progress and stall rules</title><desc id="desc">The five pipeline stages overlap. Dependencies insert bubbles, memory waits hold younger work, branches redirect fetch, and faults drain older work.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#183153"/></marker><style>.stage{fill:#eef5fb;stroke:#183153;stroke-width:2}.rule{fill:#e8f4f2;stroke:#176b63;stroke-width:1.7}.wire{stroke:#183153;stroke-width:2;marker-end:url(#arrow)}.name{font:bold 17px Arial,sans-serif;text-anchor:middle;fill:#183153}.note{font:13px Arial,sans-serif;text-anchor:middle;fill:#34495e}.title{font:bold 24px Georgia,serif;text-anchor:middle;fill:#183153}</style></defs>
<rect width="1100" height="400" fill="white"/><text x="550" y="38" class="title">Stage flow and control decisions</text>
<rect x="45" y="95" width="150" height="80" rx="8" class="stage"/><text x="120" y="128" class="name">IF</text><text x="120" y="151" class="note">fetch request</text>
<rect x="260" y="95" width="150" height="80" rx="8" class="stage"/><text x="335" y="128" class="name">ID</text><text x="335" y="151" class="note">decode and read</text>
<rect x="475" y="95" width="150" height="80" rx="8" class="stage"/><text x="550" y="128" class="name">EX</text><text x="550" y="151" class="note">ALU / branch</text>
<rect x="690" y="95" width="150" height="80" rx="8" class="stage"/><text x="765" y="128" class="name">MEM</text><text x="765" y="151" class="note">data handshake</text>
<rect x="905" y="95" width="150" height="80" rx="8" class="stage"/><text x="980" y="128" class="name">WB</text><text x="980" y="151" class="note">commit / retire</text>
<path d="M195 135H260M410 135H475M625 135H690M840 135H905" class="wire"/>
<rect x="50" y="235" width="310" height="105" rx="8" class="rule"/><text x="205" y="265" class="name">RAW dependency</text><text x="205" y="292" class="note">ID waits; bubble moves forward</text><text x="205" y="316" class="note">no forwarding in this baseline</text>
<rect x="395" y="235" width="310" height="105" rx="8" class="rule"/><text x="550" y="265" class="name">Memory or control wait</text><text x="550" y="292" class="note">hold younger stages; branch resolves in EX</text><text x="550" y="316" class="note">requests stay stable until ready</text>
<rect x="740" y="235" width="310" height="105" rx="8" class="rule"/><text x="895" y="265" class="name">Fault</text><text x="895" y="292" class="note">discard younger, drain older</text><text x="895" y="316" class="note">then publish sticky trap record</text>
</svg>
