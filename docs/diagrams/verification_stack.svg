<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">RV32I verification architecture</title>
  <desc id="desc">Machine code is checked by an independent Python model and by the SystemVerilog CPU. Cocotb drives deterministic memory wait states, compares retirement events, and writes an FST waveform for GTKWave. Directed SystemVerilog tests and lint add separate checks.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#183153"/></marker>
    <style>.source{fill:#fff8e8;stroke:#a35f18;stroke-width:2}.rtl{fill:#f7fbff;stroke:#183153;stroke-width:2}.check{fill:#e8f4f2;stroke:#176b63;stroke-width:2}.artifact{fill:#fff1ee;stroke:#b44134;stroke-width:2}.wire{fill:none;stroke:#183153;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 5;marker-end:url(#arrow)}.name{font:bold 17px Arial,sans-serif;text-anchor:middle;fill:#183153}.note{font:13px Arial,sans-serif;text-anchor:middle;fill:#34495e}.heading{font:bold 24px Georgia,serif;text-anchor:middle;fill:#183153}</style>
  </defs>
  <rect width="1200" height="650" fill="#fff"/>
  <text x="600" y="38" class="heading">Layered verification and waveform flow</text>

  <rect x="55" y="115" width="205" height="100" rx="10" class="source"/>
  <text x="158" y="150" class="name">Program generator</text><text x="158" y="178" class="note">Readable Python encoders</text><text x="158" y="199" class="note">rv32i_directed.hex</text>
  <rect x="345" y="85" width="220" height="110" rx="10" class="check"/>
  <text x="455" y="122" class="name">Python ISA model</text><text x="455" y="151" class="note">Architectural instruction steps</text><text x="455" y="174" class="note">Expected retire stream</text>
  <rect x="345" y="260" width="220" height="120" rx="10" class="rtl"/>
  <text x="455" y="298" class="name">RV32I RTL core</text><text x="455" y="327" class="note">FETCH - EXECUTE - MEMORY</text><text x="455" y="350" class="note">ready/valid native ports</text>
  <rect x="655" y="250" width="225" height="130" rx="10" class="check"/>
  <text x="768" y="287" class="name">cocotb scoreboard</text><text x="768" y="316" class="note">Deterministic wait states</text><text x="768" y="339" class="note">PC + instruction comparison</text><text x="768" y="362" class="note">Trap and stability checks</text>
  <rect x="955" y="255" width="190" height="115" rx="10" class="artifact"/>
  <text x="1050" y="292" class="name">FST waveform</text><text x="1050" y="321" class="note">GTKWave save groups</text><text x="1050" y="344" class="note">5.11 us captured</text>

  <rect x="345" y="475" width="220" height="105" rx="10" class="check"/>
  <text x="455" y="512" class="name">SV directed tests</text><text x="455" y="541" class="note">ALU, program signature, traps</text><text x="455" y="564" class="note">Icarus execution</text>
  <rect x="655" y="475" width="225" height="105" rx="10" class="check"/>
  <text x="768" y="512" class="name">Static checks</text><text x="768" y="541" class="note">Verilator lint + Slang</text><text x="768" y="564" class="note">Assertions and elaboration</text>

  <path d="M260 150 H345" class="wire"/><path d="M260 185 C305 185 305 320 345 320" class="wire"/>
  <path d="M565 140 C625 140 625 275 655 285" class="wire"/><path d="M565 320 H655" class="wire"/>
  <path d="M880 315 H955" class="wire"/><path d="M455 380 V475" class="dash"/><path d="M565 350 C620 400 690 420 735 475" class="dash"/>
  <text x="605" y="128" class="note">expected retirement</text><text x="607" y="305" class="note">observed retirement</text><text x="916" y="297" class="note">trace</text>
</svg>
